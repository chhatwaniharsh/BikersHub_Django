{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
<title>Register Page</title>
{% endblock %}

{% block content %}
<div class="container mt-5">
  <h1 style="text-align:center;">Register Page</h1>
  <form method="post">
    {% csrf_token %}
    {{form|crispy}}
    <button type="submit" class="btn btn-primary">Register</button>
  </form>
</div>
{% endblock %}
